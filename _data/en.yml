hero:
  title: Your car in good hands
  text: We're a car service in Ivanka pri Dunaji, just outside Bratislava. We handle routine maintenance, repairs and tyre changes – and we tell you up front what needs doing and what it will cost.
  cta_primary: Book an appointment
  cta_secondary: Our services
  image_alt: Our workshop

features_label: Why us
features:
  - icon: star
    title: Quality work
    text: We use proven parts and fluids, and we stand behind our work.
  - icon: clock
    title: Short lead times
    text: Routine servicing and minor repairs are usually done the same day.
  - icon: list
    title: All in one place
    text: Servicing, tyres and MOT preparation – no need to drive around town.
  - icon: gift
    title: Fair prices
    text: You get the price before we start. No surprises when you pick up your car.

services:
  eyebrow: Services
  title: How we can help
  text: We look after cars and vans of all makes. If you don't see what you need, give us a call – we're happy to advise.
  items:
    - title: Car service
      text: Scheduled maintenance according to the manufacturer's plan and mechanical repairs.
      list: [oil and filter change, "timing belt, clutch, exhaust", service book stamps]
    - title: Tyre service
      text: Seasonal tyre changes, wheel balancing and puncture repair while you wait.
      list: [tyre change and balancing, puncture repair, tyres to order]
    - title: Diagnostics
      text: Warning light on? We'll connect the diagnostics, find the cause and explain the options.
      list: [computer diagnostics, electrical systems]
    - title: Brakes and suspension
      text: Inspection and replacement of brake pads, discs, shock absorbers and joints.
      list: [brakes and brake fluid, "shocks, control arms, bearings"]
    - title: Air conditioning
      text: A/C recharge and disinfection, so you don't spend the summer driving with the windows down.
      list: [recharge and leak check, cleaning and disinfection]
    - title: MOT preparation
      text: Before the technical (STK) and emissions (EK) inspection, we check your car and fix what's needed.
      list: [pre-inspection check, defect repair]

