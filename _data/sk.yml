features_label: Prečo my
features:
  - icon: star
    title: Kvalitná práca
    text: Používame overené diely a náplne a za svojou prácou si stojíme.
  - icon: clock
    title: Krátke termíny
    text: Bežný servis a menšie opravy zvládneme spravidla ešte v ten istý deň.
  - icon: list
    title: Všetko na jednom mieste
    text: Servis, pneuservis aj príprava na STK – nemusíte behať po meste.
  - icon: gift
    title: Férová cena
    text: Cenu vám povieme vopred. Žiadne prekvapenia pri preberaní auta.

services:
  eyebrow: Služby
  title: S čím vám pomôžeme
  text: Staráme sa o osobné autá a dodávky všetkých značiek. Ak tu niečo nevidíte, zavolajte – radi poradíme.
  items:
    - title: Autoservis
      text: Pravidelné servisné prehliadky podľa predpisu výrobcu a opravy mechaniky.
      list: [výmena oleja a filtrov, "rozvody, spojka, výfuk", servisná knižka]
    - title: Pneuservis
      text: Sezónne prezutie, vyváženie kolies a oprava defektu na počkanie.
      list: [prezutie a vyváženie, oprava defektu, predaj pneumatík na objednávku]
    - title: Diagnostika
      text: Svieti vám kontrolka? Pripojíme diagnostiku, nájdeme príčinu a vysvetlíme, čo s tým.
      list: [počítačová diagnostika, elektroinštalácia]
    - title: Brzdy a podvozok
      text: Kontrola a výmena brzdových platničiek, kotúčov, tlmičov a čapov.
      list: [brzdy a brzdová kvapalina, "tlmiče, ramená, ložiská"]
    - title: Klimatizácia
      text: Plnenie a dezinfekcia klimatizácie, aby ste v lete nemuseli jazdiť s otvoreným oknom.
      list: [plnenie a kontrola tesnosti, čistenie a dezinfekcia]
    - title: Príprava na STK a EK
      text: Auto pred technickou a emisnou kontrolou skontrolujeme a opravíme, čo treba.
      list: [predkontrola pred STK, odstránenie závad]

about:
  eyebrow: O nás
  title: Malý servis s osobným prístupom
  paragraphs:
    - Twins garage funguje od roku 2023 v Ivanke pri Dunaji, kúsok od Bratislavy. Každé auto riešime tak, akoby bolo naše – čo nie je nutné, nemeníme, a čo meníme, vám ukážeme.
    - Nezáleží na tom, či máte nové auto v záruke alebo starší rodinný voz. Prídite sa poradiť.
