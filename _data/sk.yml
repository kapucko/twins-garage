  title: Vaše auto v dobrých rukách
  lead: Poctivo, rýchlo a bez zbytočných rečí
  text: Sme autoservis v Ivanke pri Dunaji, kúsok od Bratislavy. Postaráme sa o pravidelný servis, opravy aj prezutie pneumatík – vopred vám povieme, čo treba urobiť a koľko to bude stáť.
